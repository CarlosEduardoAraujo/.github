name: Sugerir uma Funcionalidade
description: Proponha novos recursos, melhorias de desempenho ou ajustes no comportamento do projeto.
title: "[Feature]: "
labels: ["enhancement", "triage"]

body:
  - type: markdown
    attributes:
      value: |
        Tem uma ideia para melhorar o projeto? Preencha os campos abaixo explicando o problema que essa funcionalidade resolve e como ela deveria se comportar.

  - type: textarea
    id: problem
    attributes:
      label: Qual problema essa sugestão resolve?
      description: Descreva o cenário atual, limitação ou dificuldade que motivou a ideia.
      placeholder: "Hoje, quando preciso fazer X, sou obrigado a contornar manualmente fazendo Y..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Solução Proposta
      description: Explique de forma objetiva como você imagina o funcionamento ideal desse recurso.
      placeholder: "Gostaria que existisse uma opção / parâmetro / endpoint que permitisse..."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternativas Consideradas
      description: Você avaliou outras formas de resolver esse problema ou workarounds existentes?
      placeholder: "Tentei utilizar X, mas apresenta a limitação Y."
    validations:
      required: false

  - type: dropdown
    id: scope
    attributes:
      label: Impacto Esperado
      description: Qual área do projeto essa melhoria afeta principalmente?
      options:
        - Experiência de uso / Interface
        - Desempenho / Otimização
        - Configuração / Deploy
        - API / Integração
        - Documentação
        - Outro
    validations:
      required: true

  - type: checkboxes
    id: contribution
    attributes:
      label: Disponibilidade e Verificação
      options:
        - label: Pesquisei nas Issues abertas e fechadas para confirmar que esta ideia ainda não foi sugerida.
          required: true
        - label: Tenho interesse em enviar um Pull Request implementando esta funcionalidade caso seja aprovada.
          required: false
